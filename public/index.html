<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E Commerce Mini</title>
</head>
<body>
    <h1>Selamat Datang di E Commerce Mini</h1>
    <div id="app"></div>
    <script>
    fetch('/api/products')
        .then(response => response.json())
        .then(products => {
            const appDiv = document.getElementById('app');
            products.forEach(p => {
                appDiv.innerHTML += `<p>${p.name} - Rp${p.price.toLocaleString('id-ID')}</p>`;
            });
        });
</script>
</body>
</html>
