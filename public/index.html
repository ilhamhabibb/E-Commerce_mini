<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>E-Commerce Mini</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>🛒 E-Commerce Mini</h2>
        <div>
            <strong>Keranjang: </strong> <span id="cart-count">0</span> barang
        </div>
    </header>

    <main>
        <div id="product-list" class="product-grid">
            <!-- Produk akan di-render di sini oleh JS -->
        </div>

        <div class="cart-section">
            <h3>Ringkasan Checkout</h3>
            <ul id="cart-items"></ul>
            <p><strong>Total: Rp<span id="total-price">0</span></strong></p>
            <button id="checkout-btn" style="background: #28a745;">Checkout Sekarang</button>
        </div>
    </main>

    <script>
        let cart = [];
        let productsData = [];

        // 1. Ambil data dari Backend
        fetch('/api/products')
            .then(res => res.json())
            .then(products => {
                productsData = products;
                renderProducts();
            });

        // 2. Tampilkan Produk
        function renderProducts() {
            const list = document.getElementById('product-list');
            productsData.forEach(p => {
                list.innerHTML += `
                    <div class="card">
                        <img src="${p.image}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <p style="color: #28a745; font-weight: bold;">Rp${p.price.toLocaleString('id-ID')}</p>
                        <button onclick="addToCart(${p.id})">Tambah ke Keranjang</button>
                    </div>
                `;
            });
        }

        // 3. Logika Tambah Keranjang
        function addToCart(id) {
            const product = productsData.find(p => p.id === id);
            cart.push(product);
            updateCartUI();
        }

        // 4. Update Tampilan Keranjang
        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const cartItems = document.getElementById('cart-items');
            cartItems.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                cartItems.innerHTML += `<li>${item.name} - Rp${item.price.toLocaleString('id-ID')}</li>`;
                total += item.price;
            });
            document.getElementById('total-price').innerText = total.toLocaleString('id-ID');
        }

        // 5. Logika Checkout (Hit API Backend)
        document.getElementById('checkout-btn').addEventListener('click', () => {
            if(cart.length === 0) return alert('Keranjang kosong!');
            
            fetch('/api/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items: cart })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message + ' Total barang: ' + data.totalItems);
                cart = []; // Kosongkan keranjang
                updateCartUI();
            });
        });
    </script>
</body>
</html>
